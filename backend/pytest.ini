[pytest]
# Scoped to the new, isolated test suites only. This deliberately excludes
# the legacy test.py and test/bedrock_test.py, which make live AWS calls at
# import time -- per docs/11-AGENT-RULES.md rule 6 ("no default live
# external API calls in tests"). Those two files are historical artifacts
# of the AWS demo and are not part of default CI; see
# docs/17-BACKEND-ARCHITECTURE-GAP.md.
testpaths = test/unit test/api
timeout = 30
timeout_method = thread
